plugins { id 'com.android.application'; id 'com.google.protobuf' }
def mainnetTest = project.hasProperty("mainnetTest")
android {
    buildFeatures { buildConfig = true; resValues = true }
    namespace 'org.xbt.wallet'
    compileSdk { version = release(37) { minorApiLevel = 1 } }
    defaultConfig { applicationId (project.hasProperty('isolatedTest') ? 'org.xbt.wallet.profiletest' : mainnetTest ? 'org.xbt.wallet.mainnettest' : 'org.xbt.wallet.alpha'); minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0-alpha'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    defaultConfig {
        buildConfigField 'boolean', 'MAINNET_TEST', mainnetTest.toString()
        resValue 'string', 'app_name', mainnetTest ? 'XBT Mainnet Test' : 'XBT Alpha'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = false } }
}
protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:3.25.5' }
    generateProtoTasks { all().configureEach { builtins { java { option 'lite' } } } }
}
dependencies {
    implementation files('libs/Lndmobile.aar')
    implementation 'info.guardianproject:tor-android:0.4.9.14'
    implementation 'com.google.protobuf:protobuf-javalite:3.25.5'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.core:core:1.17.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
