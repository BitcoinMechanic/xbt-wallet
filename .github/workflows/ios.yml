name: iPhone build
on:
  workflow_dispatch:
  push:
    branches: [ios-port]
    paths: ['ios/**', 'scripts/build-ios*', 'patches/**', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: ios/Native/dependencies.lock
      - name: Install protobuf compiler
        run: brew install protobuf
      - name: Build the pinned XBT Lightning engine for iPhone and simulator
        run: scripts/build-ios-node.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Lndmobile-xcframework
          path: ios/Frameworks/Lndmobile.xcframework
          retention-days: 7
